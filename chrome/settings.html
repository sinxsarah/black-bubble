<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Bubble · Voice settings</title>
  <link rel="stylesheet" href="settings.css">
  <script defer src="settings.js"></script>
</head>
<body>
  <main>
    <header><span class="orb" aria-hidden="true"></span><span>Black Bubble</span></header>
    <h1>Choose your voice</h1>
    <p>Use this voice to read replies in your hands-free conversation.</p>
    <form id="settings">
      <fieldset id="choices"><legend>Reply voice</legend>
        <label><input type="radio" name="source" value="cove"><span><strong>ChatGPT's own voice</strong><small>Whichever voice your ChatGPT is set to, played through its own Read aloud.</small></span></label>
        <label><input type="radio" name="source" value="device"><span><strong>Device voice</strong><small>Free. Reads replies using a voice installed on this device.</small></span></label>
        <label><input type="radio" name="source" value="elevenLabs"><span><strong>ElevenLabs</strong><small>Uses your ElevenLabs voice and account credits.</small></span></label>
        <label><input type="radio" name="source" value="fishAudio"><span><strong>Fish Audio</strong><small>Uses your Fish Audio voice and account credits.</small></span></label>
      </fieldset>
      <section id="device" hidden><label for="installed">Installed voice</label><select id="installed"></select></section>
      <section id="provider" hidden>
        <p id="disclosure"></p>
        <label for="key">API key</label><input type="password" id="key" autocomplete="off" spellcheck="false">
        <div class="buttons"><button type="button" id="save-key">Save key</button><button type="button" id="forget">Forget key</button></div>
        <p class="hint" id="key-state"></p>
        <label for="voice-id">Voice ID or voice link</label><input type="text" id="voice-id" autocomplete="off" spellcheck="false">
      </section>
      <button id="apply" type="submit">Use this voice</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
